
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LovKey</title>
    <!-- Apply the saved theme before first paint so dark mode doesn't flash white.
         Mirrors the ThemeProvider in src/App.tsx (storageKey "lovkey-theme"). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lovkey-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Daily matches based on your mood and vibes. Photos stay blurred until you both choose to reveal." />

    <meta property="og:title" content="LovKey" />
    <meta property="og:description" content="Daily matches based on your mood and vibes. Photos stay blurred until you both choose to reveal." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lovkey.app/" />
    <meta property="og:site_name" content="LovKey" />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
